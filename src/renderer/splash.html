<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
      }

      body {
        background: linear-gradient(135deg, #f8c1d9, #b1daae);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      img {
        max-width: 100%;
        max-height: 100%;
        display: block;
        object-fit: contain;
      }
    </style>
  </head>

  <body>
    <img src="./splash.gif" alt="Loading…" draggable="false" />
  </body>
</html>
