name: Build & Release

# Structure follows the proven v1.0.2 (JavaFX-era) workflow:
#   prepare → per-platform build jobs (artifacts only, no publishing)
#           → single release job with contents:write that publishes everything.
# This avoids the failure modes of per-job publishing: read-only GITHUB_TOKEN
# (403 on upload) and parallel jobs racing to create the same release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version override (e.g. 1.2.3). Defaults to package.json version.'
        required: false
        default: ''

jobs:
  # ===========================================================================
  # Resolve the application version once so every downstream job sees the
  # same value (workflow_dispatch input > tag > package.json as-is).
  # ===========================================================================
  prepare:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve APP_VERSION
        id: resolve
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=""
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using APP_VERSION=${VERSION:-package.json}"

  # ===========================================================================
  # Windows x64
  # ===========================================================================
  build-windows:
    name: Build (Windows-x64)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-electron-package
        with:
          eb-args: '--win --x64'
          artifact-name: DogyMpegApp-Windows-x64
          app-version: ${{ needs.prepare.outputs.app_version }}

  # ===========================================================================
  # macOS Apple Silicon (arm64)
  # ===========================================================================
  build-macos-apple-silicon:
    name: Build (macOS-AppleSilicon)
    needs: prepare
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-electron-package
        with:
          eb-args: '--mac --arm64'
          artifact-name: DogyMpegApp-macOS-AppleSilicon
          app-version: ${{ needs.prepare.outputs.app_version }}

  # ===========================================================================
  # macOS Intel — PRIMARY attempt on macos-15-intel.
  #
  # continue-on-error keeps the workflow green if this job fails; the fallback
  # detects a real failure via the build_outcome output (the job's own
  # `result` would always read 'success' because of continue-on-error).
  # ===========================================================================
  build-macos-intel-primary:
    name: Build (macOS-Intel, primary)
    needs: prepare
    runs-on: macos-15-intel
    continue-on-error: true
    outputs:
      build_outcome: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@v4
      - id: build
        uses: ./.github/actions/build-electron-package
        with:
          eb-args: '--mac --x64'
          artifact-name: DogyMpegApp-macOS-Intel
          app-version: ${{ needs.prepare.outputs.app_version }}

  # ===========================================================================
  # macOS Intel — FALLBACK on macos-26-intel; runs only when the primary
  # actually failed. Same artifact name is safe: the primary never uploaded.
  # ===========================================================================
  build-macos-intel-fallback:
    name: Build (macOS-Intel, fallback)
    needs:
      - prepare
      - build-macos-intel-primary
    if: ${{ needs.build-macos-intel-primary.outputs.build_outcome == 'failure' }}
    runs-on: macos-26-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-electron-package
        with:
          eb-args: '--mac --x64'
          artifact-name: DogyMpegApp-macOS-Intel
          app-version: ${{ needs.prepare.outputs.app_version }}

  # ===========================================================================
  # Publish a GitHub Release on v* tags.
  #   - Windows AND macOS Apple Silicon must succeed.
  #   - macOS Intel is optional (primary/fallback both failing still releases).
  # The two mac architectures stay fully separate: Apple Silicon ships the
  # default latest-mac.yml feed; the Intel feed is renamed latest-x64-mac.yml
  # and Intel installs request it via autoUpdater.channel (see updater.ts).
  # ===========================================================================
  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-macos-apple-silicon
      - build-macos-intel-primary
      - build-macos-intel-fallback
    if: |
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-windows.result == 'success' &&
      needs.build-macos-apple-silicon.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f -printf "%p (%s bytes)\n"

      - name: Rename Intel update feed (per-arch feeds, no merging)
        run: |
          INTEL_FEED=artifacts/DogyMpegApp-macOS-Intel/latest-mac.yml
          if [[ -f "$INTEL_FEED" ]]; then
            mv "$INTEL_FEED" artifacts/DogyMpegApp-macOS-Intel/latest-x64-mac.yml
            echo "Intel feed renamed to latest-x64-mac.yml"
          else
            echo "No Intel feed in this run (Intel build optional)"
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.zip
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.blockmap
            artifacts/**/latest*.yml
