name: Build Multi-Platform Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Application version (override pom.xml version)'
        required: false
        default: ''

env:
  JAVAFX_VERSION: '21.0.8'
  # Phiên bản mặc định nếu không truyền qua workflow_dispatch và không phải tag
  DEFAULT_APP_VERSION: '1.0.2'

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64 (x86_64)
          - os: windows-latest
            label: Windows-x64
            jfx_platform: windows-x64
            artifact_name: DogyMpegApp-Windows-x64

          # macOS Intel (x86_64) - macos-13 là runner Intel cuối cùng GitHub còn cung cấp
          - os: macos-13
            label: macOS-Intel
            jfx_platform: osx-x64
            artifact_name: DogyMpegApp-macOS-Intel

          # macOS Apple Silicon (arm64) - macos-14 / macos-latest đều là ARM64
          - os: macos-14
            label: macOS-AppleSilicon
            jfx_platform: osx-aarch64
            artifact_name: DogyMpegApp-macOS-AppleSilicon

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Resolve APP_VERSION
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.app_version }}" ]]; then
            VERSION="${{ github.event.inputs.app_version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${DEFAULT_APP_VERSION}"
          fi
          echo "APP_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "Using APP_VERSION=${VERSION}"

      # -------- Download JavaFX jmods (Unix: macOS) --------
      - name: Download JavaFX jmods (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          URL="https://download2.gluonhq.com/openjfx/${JAVAFX_VERSION}/openjfx-${JAVAFX_VERSION}_${{ matrix.jfx_platform }}_bin-jmods.zip"
          echo "Downloading: $URL"
          curl -fL -o jfx-jmods.zip "$URL"
          unzip -q jfx-jmods.zip
          JFX_DIR="$(find . -maxdepth 1 -type d -name 'javafx-jmods-*' | head -n 1)"
          if [[ -z "$JFX_DIR" ]]; then
            echo "JavaFX jmods directory not found after extracting!"
            exit 1
          fi
          ABS_PATH="$(cd "$JFX_DIR" && pwd)"
          echo "PATH_TO_FX_MODS=${ABS_PATH}" >> "$GITHUB_ENV"
          echo "JavaFX jmods at: ${ABS_PATH}"

      # -------- Download JavaFX jmods (Windows) --------
      - name: Download JavaFX jmods (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://download2.gluonhq.com/openjfx/$env:JAVAFX_VERSION/openjfx-$($env:JAVAFX_VERSION)_${{ matrix.jfx_platform }}_bin-jmods.zip"
          Write-Host "Downloading: $url"
          Invoke-WebRequest -Uri $url -OutFile jfx-jmods.zip
          Expand-Archive -Path jfx-jmods.zip -DestinationPath .
          $jfxDir = Get-ChildItem -Directory -Filter "javafx-jmods-*" | Select-Object -First 1
          if (-not $jfxDir) { throw "JavaFX jmods directory not found!" }
          "PATH_TO_FX_MODS=$($jfxDir.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "JavaFX jmods at: $($jfxDir.FullName)"

      # -------- Build JAR + libs --------
      - name: Build with Maven
        shell: bash
        run: mvn -B -ntp clean package -DskipTests

      # -------- Tạo custom JRE runtime image bằng jlink --------
      - name: Create custom JRE (macOS)
        if: runner.os == 'macOS'
        run: |
          jlink \
            --module-path "$JAVA_HOME/jmods:$PATH_TO_FX_MODS" \
            --add-modules java.naming,java.sql,java.logging,javafx.controls,javafx.fxml \
            --no-header-files --no-man-pages --strip-debug --compress=2 \
            --output jre

      - name: Create custom JRE (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          jlink --module-path "$env:JAVA_HOME\jmods;$env:PATH_TO_FX_MODS" `
                --add-modules java.naming,java.sql,java.logging,javafx.controls,javafx.fxml `
                --no-header-files --no-man-pages --strip-debug --compress=2 `
                --output jre

      # -------- Package cho macOS (app-image, dmg, pkg) --------
      - name: Package for macOS
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p dist/jpackage/mac
          YEAR_SHORT="$(date +%y)"
          for TYPE in app-image dmg pkg; do
            echo "===> Building $TYPE"
            jpackage --type "$TYPE" \
              --name DogyMpegApp \
              --input target/app \
              --main-jar DogyMPEGApp.jar \
              --main-class com.chotoxautinh.Main \
              --java-options "-Xmx2048m" \
              --runtime-image jre \
              --app-version "$APP_VERSION" \
              --vendor "Dogy Inc." \
              --copyright "Copyright © 2016-${YEAR_SHORT} Dogy Inc." \
              --mac-package-name "DogyMpegApp" \
              --mac-package-identifier com.chotoxautinh \
              --icon src/main/resources/icon.icns \
              --dest dist/jpackage/mac
          done
          echo "----- macOS dist contents -----"
          ls -la dist/jpackage/mac

      # -------- Package cho Windows (app-image, exe, msi) --------
      # Windows runner đã preinstall WiX Toolset → tạo được .exe/.msi
      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\jpackage\win | Out-Null
          $yearShort = (Get-Date).Year.ToString().Substring(2)
          $types = @("app-image", "exe", "msi")
          foreach ($t in $types) {
              Write-Host "===> Building $t"
              jpackage --type $t `
                  --input target/app `
                  --name DogyMpegApp `
                  --main-jar "DogyMPEGApp.jar" `
                  --main-class "com.chotoxautinh.Main" `
                  --java-options "-Xmx2048m" `
                  --runtime-image jre `
                  --icon "src\main\resources\icon.ico" `
                  --app-version "$env:APP_VERSION" `
                  --vendor "Dogy Inc." `
                  --copyright "Copyright © 2016-$yearShort Dogy Inc." `
                  --dest dist/jpackage/win
              if ($LASTEXITCODE -ne 0) { throw "jpackage failed for type=$t" }
          }
          Write-Host "----- Windows dist contents -----"
          Get-ChildItem -Recurse dist\jpackage\win | Select-Object FullName

      # -------- Upload artifacts --------
      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/jpackage/mac/*.dmg
            dist/jpackage/mac/*.pkg
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/jpackage/win/*.exe
            dist/jpackage/win/*.msi
          if-no-files-found: error
          retention-days: 30

  # ====== Job tạo GitHub Release khi push tag v* ======
  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f -printf "%p (%s bytes)\n"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.pkg
            artifacts/**/*.exe
            artifacts/**/*.msi