name: Build Electron Package
description: >
  npm ci, optional version override, electron-vite build, electron-builder
  (no publishing — artifacts are uploaded and released by the release job).

inputs:
  eb-args:
    description: 'electron-builder target args, e.g. "--mac --arm64"'
    required: true
  artifact-name:
    description: 'Name for the uploaded artifact bundle'
    required: true
  app-version:
    description: 'Version to write into package.json (empty = keep as-is)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Set version
      if: inputs.app-version != ''
      shell: bash
      run: |
        node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version='${{ inputs.app-version }}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
        echo "Set version to ${{ inputs.app-version }}"

    - name: Build
      shell: bash
      run: npm run build

    - name: Package
      shell: bash
      run: npx electron-builder ${{ inputs.eb-args }} --publish never

    # Guard against shipping wrong-arch native modules: ffmpeg-static,
    # onnxruntime-node, and sharp ship prebuilt host-arch binaries, so packaging
    # an x64 app on an arm64 host (or vice-versa) yields an installer that
    # crashes on launch ("Cannot find module .../darwin/x64/onnxruntime_binding.node").
    # Each arch must be built on its own native runner; this asserts it before upload.
    - name: Verify packaged native binaries match target arch (macOS)
      if: contains(inputs.eb-args, '--mac')
      shell: bash
      run: |
        set -uo pipefail
        if [[ "${{ inputs.eb-args }}" == *"--x64"* ]]; then ARCH=x64; MACHO=x86_64; OUT=release/mac; else ARCH=arm64; MACHO=arm64; OUT=release/mac-arm64; fi
        UNP="$OUT/DogyMpegApp.app/Contents/Resources/app.asar.unpacked/node_modules"
        echo "Verifying darwin/$ARCH ($MACHO) native binaries under $UNP"
        fail=0
        check_macho() { # <path> <label>
          if [[ ! -f "$1" ]]; then echo "::error::missing $2: $1"; fail=1; return; fi
          local a; a=$(lipo -archs "$1" 2>/dev/null || true)
          echo "  $2: $a"
          [[ "$a" == *"$MACHO"* ]] || { echo "::error::$2 is not $MACHO (got: $a)"; fail=1; }
        }
        check_macho "$UNP/onnxruntime-node/bin/napi-v6/darwin/$ARCH/onnxruntime_binding.node" "onnxruntime-node"
        check_macho "$UNP/@img/sharp-darwin-$ARCH/lib/sharp-darwin-$ARCH.node" "sharp"
        check_macho "$UNP/ffmpeg-static/ffmpeg" "ffmpeg-static"
        if [[ $fail -ne 0 ]]; then
          echo "::error::Packaged app has wrong-arch native modules for darwin/$ARCH — refusing to upload a build that would crash on launch."
          exit 1
        fi
        echo "OK: all native binaries are darwin/$ARCH"

    # latest*.yml are the electron-updater feeds; .blockmap enables
    # differential downloads. Both must reach the GitHub Release.
    # Single-level globs only: release/** would sweep the win-unpacked/ and
    # mac-arm64/ staging trees (raw app .exe, elevate.exe, unpacked ffmpeg)
    # into the artifact — installers and feeds live at the release/ root.
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          release/*.dmg
          release/*.pkg
          release/*.zip
          release/*.exe
          release/*.msi
          release/*.blockmap
          release/latest*.yml
        if-no-files-found: error
        retention-days: 30
