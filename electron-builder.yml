appId: com.chotoxautinh.dogympegapp
productName: DogyMpegApp
copyright: Copyright © 2016-2026 Dogy Inc.
directories:
  buildResources: resources
  output: release
files:
  - '!**/.vscode/*'
  - '!{.eslintrc.cjs,.prettierrc,.gitignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,electron.vite.config.ts}'
  - '!{README.md,CLAUDE.md,LICENSE.md}'
  - '!**/*.{ts,tsx,map}'
  - '!{src,resources}/**'
extraResources:
  - from: resources/models
    to: models
  - from: resources/sample-images
    to: sample-images
  - from: resources/icon.png
    to: icon.png
asarUnpack:
  - '**/node_modules/ffmpeg-static/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/onnxruntime-node/**'
  - '**/node_modules/better-sqlite3/**'
# Arch is selected per CI job via CLI flags (--arm64 / --x64) — never list
# arch arrays here. Config arch overrides the CLI, making one invocation build
# both arches, which (a) races electron-builder's pkg target on a shared
# intermediate file (ENOENT unlink com.*.pkg) and (b) packages host-arch sharp
# binaries into the foreign-arch app.
mac:
  category: public.app-category.video
  icon: resources/icon.icns
  # Always include the arch: electron-builder's default omits it for x64,
  # making Intel artifacts look like arch-less duplicates on the release page.
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - dmg
    - pkg
    # electron-updater on macOS can only apply updates from a zip artifact;
    # dmg/pkg are install media. Without this, mac auto-update silently fails.
    - zip
win:
  icon: resources/icon.ico
  target:
    - nsis
    - msi
publish:
  provider: github
  releaseType: release
